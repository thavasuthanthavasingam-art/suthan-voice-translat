<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suthan Voice Translator V3</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f2f5fb;color:#17233b;margin:0;padding:18px}main{max-width:650px;margin:auto}header{text-align:center}section{background:white;border-radius:18px;padding:18px;margin:16px 0}select,textarea,audio{width:100%;box-sizing:border-box;margin:8px 0 12px;padding:12px;font:inherit}textarea{min-height:110px;border:1px solid #b8c7db;border-radius:10px}select{border:1px solid #b8c7db;border-radius:10px}button{border:0;border-radius:10px;background:#1764d8;color:white;padding:13px;margin:4px 3px 4px 0;font:inherit;font-weight:600}button:disabled{opacity:.45}.secondary{background:#e4ebf8;color:#194887}.status{white-space:pre-wrap;color:#29476a}.error{color:#b42318}small{color:#66758e}label{font-weight:650;display:block}</style></head><body><main><header><h1>🎙️ Suthan Voice Translator</h1><small>தமிழ் ↔ உலக மொழிகள் · Version 3 · Microphone Test</small></header><section><label for="from">பேசும் மொழி / From</label><select id="from"></select><button class="secondary" id="swap">⇅ மொழிகளை மாற்று</button><label for="to">மொழிபெயர்க்கும் மொழி / To</label><select id="to"></select></section><section><label for="input">நீங்கள் பேசுவது / Input</label><textarea id="input" placeholder="தமிழில் எழுதுங்கள்; குரல் பதிவை கீழே சோதிக்கலாம்"></textarea><div><button id="record">🎤 பதிவு தொடங்கு</button><button id="stop" class="secondary" disabled>■ பதிவு நிறுத்து</button></div><p id="micStatus" class="status" role="status">மைக்ரோஃபோன் சோதனை தயாராக உள்ளது.</p><audio id="preview" controls hidden></audio><p><small>இந்தப் பதிப்பு Safari SpeechRecognition-ஐப் பயன்படுத்தாது. குரல் பதிவைச் சோதிக்கிறது. பதிவை எழுத்தாக மாற்ற தனி Speech-to-Text சேவை இன்னும் இணைக்கப்பட வேண்டும்.</small></p></section><section><button id="translate">🌍 மொழிபெயர்க்கவும்</button><button id="clear" class="secondary">அழிக்கவும்</button><p id="translationStatus" class="status" role="status"></p><label for="output">மொழிபெயர்ப்பு</label><textarea id="output" readonly></textarea><button id="speak">🔊 ஒலிக்கவும்</button><button id="copy" class="secondary">📋 நகலெடுக்கவும்</button></section></main><script>
'use strict';
const langs=[['ta','தமிழ் / Tamil'],['en','English'],['fr','Français / பிரெஞ்சு'],['de','Deutsch / ஜெர்மன்'],['zh-CN','中文 / சீனம்'],['ja','日本語 / ஜப்பானியம்'],['si','සිංහල / சிங்களம்'],['hi','हिन्दी / இந்தி'],['ko','한국어 / கொரியன்'],['ml','മലയാളം / மலையாளம்'],['te','తెలుగు / தெலுங்கு']];
const $=id=>document.getElementById(id),from=$('from'),to=$('to');for(const [code,label] of langs){for(const el of [from,to]){let opt=document.createElement('option');opt.value=code;opt.textContent=label;el.appendChild(opt)}}from.value='ta';to.value='fr';
let stream=null,recorder=null,chunks=[],url=null,recording=false;
function status(msg,bad=false){$('micStatus').textContent=msg;$('micStatus').className='status'+(bad?' error':'')}
function tstatus(msg,bad=false){$('translationStatus').textContent=msg;$('translationStatus').className='status'+(bad?' error':'')}
function buttons(active){$('record').disabled=active;$('stop').disabled=!active}
function release(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
$('record').onclick=async()=>{if(recording)return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status('இந்த Safari-யில் ஒலிப்பதிவு வசதி இல்லை.',true);return}buttons(true);status('மைக்ரோஃபோன் அனுமதி கேட்கப்படுகிறது…');try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const preferred=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,preferred?{mimeType:preferred}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onerror=e=>{status('பதிவு பிழை: '+(e.error?.message||'தெரியாத பிழை'),true);release();recording=false;buttons(false)};recorder.onstop=()=>{recording=false;release();buttons(false);if(!chunks.length){status('ஒலி கிடைக்கவில்லை. மீண்டும் முயற்சிக்கவும்.',true);return}if(url)URL.revokeObjectURL(url);const blob=new Blob(chunks,{type:recorder.mimeType||'audio/mp4'});url=URL.createObjectURL(blob);$('preview').src=url;$('preview').hidden=false;status('✅ குரல் பதிவு வெற்றிகரமாக முடிந்தது. கீழே Play செய்து கேளுங்கள். எழுத்தாக்க சேவை இன்னும் இணைக்கப்படவில்லை.')};recorder.start();recording=true;status('🔴 பதிவு நடக்கிறது. தமிழில் பேசுங்கள்; பிறகு நிறுத்து அழுத்துங்கள்.')}catch(e){release();recording=false;buttons(false);status('மைக்ரோஃபோன் அணுக முடியவில்லை: '+e.name+' — '+e.message,true)}};
$('stop').onclick=()=>{if(recorder&&recorder.state==='recording'){status('பதிவு நிறுத்தப்படுகிறது…');recorder.stop()}};
$('swap').onclick=()=>{const old=from.value;from.value=to.value;to.value=old;const txt=$('input').value;$('input').value=$('output').value;$('output').value=txt;tstatus('மொழிகள் மாற்றப்பட்டன.')};
$('clear').onclick=()=>{$('input').value='';$('output').value='';tstatus('')};
$('translate').onclick=async()=>{const text=$('input').value.trim();if(!text){tstatus('முதலில் உரையை எழுதுங்கள்.',true);return}if(from.value===to.value){$('output').value=text;tstatus('இரண்டும் ஒரே மொழி.');return}const btn=$('translate');btn.disabled=true;tstatus('மொழிபெயர்க்கப்படுகிறது…');try{const endpoint='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+encodeURIComponent(from.value+'|'+to.value);const response=await fetch(endpoint);if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!data.responseData?.translatedText||Number(data.responseStatus)>=400)throw Error(data.responseDetails||'Translation unavailable');const decode=document.createElement('textarea');decode.innerHTML=data.responseData.translatedText;$('output').value=decode.value;tstatus('மொழிபெயர்ப்பு முடிந்தது. சரிபார்த்துப் பயன்படுத்தவும்.')}catch(e){tstatus('மொழிபெயர்ப்பு தோல்வி: '+e.message,true)}finally{btn.disabled=false}};
$('speak').onclick=()=>{const txt=$('output').value.trim();if(!txt){tstatus('முதலில் மொழிபெயர்க்கவும்.',true);return}if(!('speechSynthesis'in window)){tstatus('ஒலி வாசிப்பு ஆதரிக்கப்படவில்லை.',true);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=to.value;u.rate=.9;u.onerror=()=>tstatus('இந்த மொழிக்கான குரல் கிடைக்கவில்லை.',true);speechSynthesis.speak(u)};
$('copy').onclick=async()=>{if(!$('output').value)return;try{await navigator.clipboard.writeText($('output').value);tstatus('நகலெடுக்கப்பட்டது.')}catch(e){$('output').focus();$('output').select();tstatus('Copy செய்ய உரை தேர்ந்தெடுக்கப்பட்டது.')}};
</script></body></html>
